<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corgi Run - by Lucas Prado</title>
  <style>
    :root {
      --mario-sky: #5c94fc;
      --night-sky: #0f172a;
      --primary: #FF9F1C; /* Laranja */
      --secondary: #FFBF69;
      --accent: #7f5af0;  /* Roxo */
      --background: #CBF3F0;
      --text: #2EC4B6;
      --text-dark: #2B2D42;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: transparent; 
      color: var(--text-dark);
      overflow: hidden;
      text-align: center;
      user-select: none;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    #game-container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 5px;
      flex-wrap: wrap; 
      gap: 10px;
    }

    h1 {
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: auto;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--white);
      border: 2px solid #ccc;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      padding-bottom: 2px;
    }

    .icon-btn:hover {
      transform: scale(1.1);
      border-color: var(--accent);
    }

    #high-score-header {
      font-size: clamp(0.8rem, 3vw, 1rem);
      color: var(--primary);
      background: var(--white);
      padding: 6px 12px;
      border-radius: 25px;
      border: 2px solid var(--primary);
      box-shadow: 0 4px 6px rgba(255, 159, 28, 0.15);
      font-weight: 700;
    }

    #score-display {
      font-size: clamp(0.8rem, 3vw, 1rem);
      color: var(--accent);
      background: var(--white);
      padding: 6px 12px;
      border-radius: 25px;
      border: 2px solid var(--accent);
      box-shadow: 0 4px 6px rgba(127, 90, 240, 0.15);
      font-weight: 700;
    }

    #game-area {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 200px;
      background-color: var(--mario-sky);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 4px solid var(--white);
      transition: background-color 8s ease; 
    }

    #game-area.night-mode {
      background-color: var(--night-sky);
    }

    #game-area::after {
      content: '';
      position: absolute;
      top: 20px;
      right: 30px;
      width: 35px;
      height: 35px;
      background: #fde047;
      border-radius: 50%;
      box-shadow: 0 0 20px #fef08a;
      z-index: 0;
      transition: background 8s ease, box-shadow 8s ease;
    }

    #game-area.night-mode::after {
      background: #f1f5f9;
      box-shadow: 0 0 20px #cbd5e1;
    }

    #stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      transition: opacity 8s ease;
      pointer-events: none;
    }

    #game-area.night-mode #stars-container {
      opacity: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 4px white;
      animation: twinkle 2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .shooting-star {
      position: absolute;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
      z-index: 0;
    }

    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
      100% { transform: translateX(-300px) translateY(300px) rotate(-45deg); opacity: 0; }
    }

    .cloud {
      position: absolute;
      background: var(--white);
      border-radius: 50px;
      opacity: 0.8;
      z-index: 1;
      box-shadow: 20px 10px 0 5px var(--white), 40px 0px 0 0px var(--white);
    }

    @keyframes floatClouds {
      0% { left: 100%; }
      100% { left: -30%; }
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35px; 
      background-image: url('https://cc-cdn.adobe.com/graceland/ILST/pt_BR/2.0.0/8d6807d0-9f62-11ed-a5b5-9969fa92018a/CAPA_1.jpg?1674948291310');
      background-size: auto 100%;
      background-repeat: repeat-x;
      border-top: 3px solid #2d6a4f;
      z-index: 2;
      transition: filter 8s ease;
    }

    #game-area.night-mode #ground {
      filter: brightness(0.4);
    }

    .ground-moving {
      animation: scrollGroundTexture 1s linear infinite;
    }

    @keyframes scrollGroundTexture {
      from { background-position: 0 0; }
      to { background-position: -200px 0; }
    }

    #corgi {
      position: absolute;
      bottom: 22px; 
      left: 10%;
      width: 80px;
      height: 60px;
      background-image: url('https://media.baamboozle.com/uploads/images/319422/1626469260_45848_gif-url.gif');
      background-size: contain;
      background-position: bottom;
      background-repeat: no-repeat;
      z-index: 4;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.15));
    }

    #obstacle {
      position: absolute;
      bottom: 35px; 
      left: 100%;
      width: 45px; 
      height: 55px; 
      z-index: 3;
      display: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      background-size: contain;
      background-repeat: no-repeat;
      background-position: bottom center;
    }

    /* --- LAYOUT DO MODAL OTIMIZADO PARA PERFORMANCE E COM DESTAQUE ROXO --- */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92); /* Removido o blur pesadão, substituído por opacidade sólida */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .modal-box {
      background: var(--white);
      padding: 15px 25px; 
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(127, 90, 240, 0.15); /* Sombra mais leve com tom arroxeado */
      width: 95%;
      max-width: 450px; 
      display: flex;
      flex-direction: row; 
      align-items: center;
      gap: 20px;
      text-align: left;
      animation: popIn 0.3s ease-out forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-image-container {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .modal-box h2 {
      background: linear-gradient(45deg, var(--accent), var(--primary)); /* Começa com Roxo agora */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem; 
      margin-bottom: 2px; 
      line-height: 1.2;
    }

    .modal-box p {
      color: #64748b;
      margin-bottom: 12px; 
      font-size: 0.85rem;
      font-weight: 500;
    }

    .corgi-ready-img, .game-over-img {
      width: 80px; 
      height: 80px; 
      object-fit: contain;
    }

    .corgi-ready-img {
      border-radius: 50%;
    }

    .stats-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px; 
      width: 100%;
    }

    .stat-badge {
      background: #fcfcfc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 6px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Cores Temáticas nos Badges */
    .stat-badge.score-badge { border-color: var(--accent); background: #f3f0ff; }
    .stat-badge.score-badge .stat-value { color: var(--accent); }
    
    .stat-badge.best-badge { border-color: var(--primary); background: #fff8f0; }
    .stat-badge.best-badge .stat-value { color: var(--primary); }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .action-btn {
      padding: 10px 15px; 
      background: linear-gradient(to right, var(--accent), #9374ff); /* Roxo predominante */
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-size: 0.95rem; 
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(127, 90, 240, 0.4);
      transition: all 0.2s ease;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(127, 90, 240, 0.6);
      filter: brightness(1.05);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    #message { display: none; }

    #controls {
      margin-top: 8px;
      color: #888;
      font-size: 0.8rem;
    }

    #controls p { margin-bottom: 2px; }
    
    #credits {
      font-size: 0.7rem;
      font-weight: 600;
      color: #aaa;
    }

    @media (max-width: 400px) {
      .modal-box {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      .stat-badge { align-items: center; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <h1>Corgi Run</h1> 
      <div class="header-stats">
        <button id="mute-btn" class="icon-btn" title="Mute/Unmute">🔊</button>
        <div id="high-score-header">Best: 0</div>
        <div id="score-display">Score: 0</div>
      </div>
    </header>

    <div id="game-area">
      <div id="stars-container"></div>
      
      <div id="start-screen" class="overlay-screen">
        <div class="modal-box">
          <div class="modal-image-container">
            <img src="https://wallpapers.com/images/hd/smiling-corgi-headshot-png-l2qngaxx0vtgc2u9.jpg" alt="Smiling Corgi" class="corgi-ready-img">
          </div>
          <div class="modal-content">
            <h2>Ready to Run?</h2>
            <p>Dodge the cacti and ghosts!</p>
            <button id="start-btn" class="action-btn">Start Game</button>
          </div>
        </div>
      </div>
      
      <div id="message" class="overlay-screen">
        <div class="modal-box">
          <div class="modal-image-container">
            <img src="https://i.redd.it/1mys0cr085c91.png" alt="Funny Dead Corgi" class="game-over-img">
          </div>
          <div class="modal-content">
            <h2>Game Over!</h2>
            <div class="stats-box">
              <div class="stat-badge score-badge">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="final-score">0</span>
              </div>
              <div class="stat-badge best-badge">
                <span class="stat-label">Best</span>
                <span class="stat-value" id="high-score">0</span>
              </div>
            </div>
            <button id="restart-btn" class="action-btn">Play Again</button>
          </div>
        </div>
      </div>

      <div id="corgi"></div>
      <div id="obstacle"></div>
      <div id="ground"></div>
    </div>

    <div id="controls">
      <p>Tap, Click, or press Spacebar to jump!</p>
      <div id="credits">Developed by Lucas Prado</div> </div>
  </div>

  <script>
    const ASSETS = {
      cactus: 'https://static.vecteezy.com/system/resources/previews/009/400/064/non_2x/cactus-clipart-design-illustration-free-png.png',
      ghost: 'https://static.vecteezy.com/system/resources/previews/011/793/532/non_2x/simplicity-halloween-ghost-freehand-drawing-flat-design-free-png.png'
    };

    const DOM = {
      corgi: document.getElementById('corgi'),
      obstacle: document.getElementById('obstacle'),
      message: document.getElementById('message'),
      scoreDisplay: document.getElementById('score-display'),
      highScoreHeader: document.getElementById('high-score-header'),
      finalScore: document.getElementById('final-score'),
      highScoreText: document.getElementById('high-score'),
      gameArea: document.getElementById('game-area'),
      startScreen: document.getElementById('start-screen'),
      ground: document.getElementById('ground'),
      starsContainer: document.getElementById('stars-container'),
      muteBtn: document.getElementById('mute-btn')
    };

    const state = {
      isGaming: false,
      score: 0,
      highScore: 0,
      speed: 7, // Voltei para 7 para resolver a lentidão
      frames: 0,
      corgiY: 0,
      corgiVelocity: 0,
      gravity: 0.8,    
      jumpPower: -16, // Voltei para -16 para o pulo ficar ágil
      isGrounded: true,
      obstacleX: 1000,
      gameLoopId: null,
      isMuted: false 
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playJumpSound() {
      if (state.isMuted) return; 
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      
      gainNode.gain.setValueAtTime(0.2, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function playGameOverSound() {
      if (state.isMuted) return; 
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.type = 'sawtooth';
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
      
      gainNode.gain.setValueAtTime(0.3, now);
      gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function init() {
      const savedScore = localStorage.getItem('corgiHighScore');
      if (savedScore) {
        state.highScore = parseInt(savedScore, 10);
        DOM.highScoreHeader.textContent = `Best: ${state.highScore}`;
        DOM.highScoreText.textContent = state.highScore; 
      }

      createClouds();
      createStars();
      setupEvents();
    }

    function createClouds() {
      DOM.gameArea.querySelectorAll('.cloud').forEach(c => c.remove());
      for (let i = 0; i < 4; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.width = `${Math.random() * 50 + 40}px`;
        cloud.style.height = `${Math.random() * 15 + 15}px`;
        cloud.style.top = `${Math.random() * 25}%`;
        
        const duration = Math.random() * 15 + 15; 
        const delay = Math.random() * -30; 
        cloud.style.animation = `floatClouds ${duration}s linear ${delay}s infinite`;
        
        DOM.gameArea.appendChild(cloud);
      }
    }

    function createStars() {
      for (let i = 0; i < 25; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 50}%`;
        star.style.animationDelay = `${Math.random() * 2}s`;
        DOM.starsContainer.appendChild(star);
      }
    }

    function spawnShootingStar() {
      const star = document.createElement('div');
      star.className = 'shooting-star';
      star.style.left = `${Math.random() * 60 + 40}%`;
      star.style.top = `${Math.random() * 20}%`;
      star.style.animation = 'shoot 1.2s linear forwards';
      DOM.starsContainer.appendChild(star);
      
      setTimeout(() => star.remove(), 1200);
    }

    function setupEvents() {
      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('restart-btn').addEventListener('click', startGame);
      
      DOM.muteBtn.addEventListener('click', () => {
        state.isMuted = !state.isMuted;
        DOM.muteBtn.textContent = state.isMuted ? '🔇' : '🔊';
        DOM.muteBtn.blur(); 
      });

      const jumpHandler = (e) => {
        if(e.code === 'Space') e.preventDefault(); 
        if (!state.isGaming && e.type !== 'keydown') return;
        if (!state.isGaming && ['Space', 'ArrowUp', 'w'].includes(e.code)) return startGame();
        jump();
      };

      document.addEventListener('touchstart', jumpHandler, { passive: false });
      document.addEventListener('mousedown', jumpHandler);
      document.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'w'].includes(e.code)) jumpHandler(e);
      });
    }

    function jump() {
      if (state.isGrounded && state.isGaming) {
        state.corgiVelocity = state.jumpPower;
        state.isGrounded = false;
        playJumpSound();
      }
    }

    function startGame() {
      if (!state.isMuted && audioCtx.state === 'suspended') audioCtx.resume();
      
      state.isGaming = true;
      state.score = 0;
      state.frames = 0;
      state.speed = 7; // Física rápida de volta
      state.corgiY = 0;
      state.obstacleX = DOM.gameArea.offsetWidth + 50;
      state.corgiVelocity = 0;
      
      DOM.gameArea.classList.remove('night-mode');
      DOM.startScreen.style.display = 'none';
      DOM.message.style.display = 'none';
      
      DOM.obstacle.style.backgroundImage = `url(${ASSETS.cactus})`;
      DOM.obstacle.style.display = 'block';
      
      DOM.ground.classList.add('ground-moving');
      DOM.scoreDisplay.textContent = `Score: 0`;

      if (state.gameLoopId) cancelAnimationFrame(state.gameLoopId);
      gameLoop();
    }

    function gameLoop() {
      if (!state.isGaming) return;

      updatePhysics();
      updateObstacle();
      checkCollision();
      updateScore();

      if (DOM.gameArea.classList.contains('night-mode') && Math.random() < 0.005) {
        spawnShootingStar();
      }

      state.gameLoopId = requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      state.corgiVelocity += state.gravity;
      state.corgiY += state.corgiVelocity;

      if (state.corgiY >= 0) {
        state.corgiY = 0;
        state.isGrounded = true;
        state.corgiVelocity = 0;
      }

      DOM.corgi.style.transform = `translateY(${state.corgiY}px)`;
    }

    function updateObstacle() {
      state.obstacleX -= state.speed;
      
      if (state.obstacleX < -80) {
        state.obstacleX = DOM.gameArea.offsetWidth + Math.random() * 400 + 200; 
        
        if (DOM.gameArea.classList.contains('night-mode')) {
          DOM.obstacle.style.backgroundImage = `url(${ASSETS.ghost})`; 
        } else {
          DOM.obstacle.style.backgroundImage = `url(${ASSETS.cactus})`; 
        }
      }
      
      DOM.obstacle.style.left = `${state.obstacleX}px`;
    }

    function updateScore() {
      state.frames++;
      if (state.frames % 10 === 0) {
        state.score++;
        DOM.scoreDisplay.textContent = `Score: ${state.score}`;
        
        if (state.score % 50 === 0) {
          state.speed += 0.8; 
        }

        const cycle = Math.floor(state.score / 200);
        if (cycle % 2 !== 0) {
          DOM.gameArea.classList.add('night-mode');
        } else {
          DOM.gameArea.classList.remove('night-mode');
        }
      }
    }

    function checkCollision() {
      const corgiRect = DOM.corgi.getBoundingClientRect();
      const obsRect = DOM.obstacle.getBoundingClientRect();

      const toleranceX = 15; 
      const toleranceY = 15;

      if (
        corgiRect.right - toleranceX > obsRect.left &&
        corgiRect.left + toleranceX < obsRect.right &&
        corgiRect.bottom - toleranceY > obsRect.top &&
        corgiRect.top + toleranceY < obsRect.bottom
      ) {
        gameOver();
      }
    }

    function gameOver() {
      state.isGaming = false;
      DOM.ground.classList.remove('ground-moving');
      
      playGameOverSound();
      
      if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('corgiHighScore', state.highScore);
      }
      
      DOM.highScoreHeader.textContent = `Best: ${state.highScore}`;
      DOM.finalScore.textContent = state.score;
      DOM.highScoreText.textContent = state.highScore;
      
      DOM.message.style.display = 'flex';
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
