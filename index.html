<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corgi Run - by Lucas Prado</title>
  <style>
    :root {
      --mario-sky: #5c94fc; /* Azul clássico do Mario */
      --primary: #FF9F1C;
      --secondary: #FFBF69;
      --background: #CBF3F0;
      --text: #2EC4B6;
      --text-dark: #2B2D42;
      --ground-top: #80ED99;
      --ground-bottom: #57CC99;
      --white: #FFFFFF;
      /* Cores das colinas do Mario */
      --hill-dark: #00a800;
      --hill-light: #4bd04b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      color: var(--text-dark);
      overflow: hidden;
      text-align: center;
      user-select: none;
      padding: 15px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    #game-container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #score-display {
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: var(--text-dark);
      background: var(--white);
      padding: 8px 20px;
      border-radius: 25px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      font-weight: 700;
    }

    #game-area {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 250px;
      max-height: 50vh;
      background-color: var(--mario-sky); /* Fundo Céu do Mario */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 4px solid var(--white);
    }

    /* --- Recriação do Fundo do Mario com CSS (As Colinas e Arbustos) --- */
    #game-area::before {
      content: '';
      position: absolute;
      bottom: 25px; /* Acima do chão */
      left: 0;
      width: 100%;
      height: 120px;
      z-index: 0;
      background-image: 
        /* Colina Grande */
        radial-gradient(circle at 20% 120px, var(--hill-dark) 60px, transparent 61px),
        radial-gradient(circle at 20% 110px, var(--hill-light) 60px, transparent 61px),
        /* Colina Média */
        radial-gradient(circle at 70% 130px, var(--hill-dark) 50px, transparent 51px),
        radial-gradient(circle at 70% 120px, var(--hill-light) 50px, transparent 51px),
        /* Arbustos */
        radial-gradient(circle at 45% 150px, #00cd00 25px, transparent 26px),
        radial-gradient(circle at 50% 145px, #00cd00 30px, transparent 31px),
        radial-gradient(circle at 55% 150px, #00cd00 25px, transparent 26px);
      background-position: 0 0;
      opacity: 0.8;
    }

    /* O Sol/Lua do Mario (mais simples) */
    #game-area::after {
      content: '';
      position: absolute;
      top: 30px;
      right: 50px;
      width: 40px;
      height: 40px;
      background: #fde047;
      border-radius: 50%;
      box-shadow: 0 0 20px #fef08a;
      z-index: 0;
    }

    .cloud {
      position: absolute;
      background: var(--white);
      border-radius: 50px;
      opacity: 0.95;
      z-index: 1;
      box-shadow: 20px 10px 0 5px var(--white), 40px 0px 0 0px var(--white);
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 25px;
      background: linear-gradient(to bottom, var(--ground-top) 30%, var(--ground-bottom) 100%);
      border-top: 3px solid #2d6a4f;
      z-index: 2;
    }

    .ground-moving {
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 20px,
        rgba(0, 0, 0, 0.05) 20px,
        rgba(0, 0, 0, 0.05) 40px
      );
      animation: scrollGround 0.6s linear infinite;
    }

    @keyframes scrollGround {
      from { background-position: 0 0; }
      to { background-position: -56px 0; }
    }

    #corgi {
      position: absolute;
      bottom: 25px;
      left: 10%;
      width: 80px;
      height: 60px;
      background-image: url('https://media.baamboozle.com/uploads/images/319422/1626469260_45848_gif-url.gif');
      background-size: contain;
      background-position: bottom;
      background-repeat: no-repeat;
      z-index: 4;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.15));
    }

    #obstacle {
      position: absolute;
      bottom: 22px;
      left: 100%;
      font-size: 45px;
      z-index: 3;
      display: none;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      border-radius: 16px;
    }

    .modal-box {
      background: var(--white);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 90%;
      width: 340px;
      transform: scale(1);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-box h2 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-box p {
      color: #666;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    /* --- O Corgi Sorridente que você pediu --- */
    .corgi-ready-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid var(--secondary);
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .emoji-large {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .stats-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #eee;
    }

    .stats-box div {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-dark);
      margin: 5px 0;
    }

    .action-btn {
      padding: 12px 30px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 159, 28, 0.4);
      transition: all 0.2s;
      width: 100%;
    }

    .action-btn:hover {
      background: var(--secondary);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 159, 28, 0.5);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    #message { display: none; }

    #controls {
      margin-top: 20px;
      color: #888;
      font-size: 0.9rem;
    }

    #controls p { margin-bottom: 5px; }
    
    #credits {
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
    }

    @media (min-width: 768px) {
      #corgi { width: 90px; height: 70px; }
      #obstacle { font-size: 50px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <h1>Corgi Run</h1> <div id="score-display">Score: 0</div>
    </header>

    <div id="game-area">
      <div id="start-screen" class="overlay-screen">
        <div class="modal-box">
          <img src="https://wallpapers.com/images/hd/smiling-corgi-headshot-png-l2qngaxx0vtgc2u9.jpg" alt="Smiling Corgi" class="corgi-ready-img">
          <h2>Ready to Run?</h2>
          <p>Dodge the cacti and beat your high score!</p>
          <button id="start-btn" class="action-btn">Start Game</button>
        </div>
      </div>
      
      <div id="message" class="overlay-screen">
        <div class="modal-box">
          <div class="emoji-large">💥</div>
          <h2>Game Over!</h2>
          <p>Ouch! You bumped into a cactus.</p>
          <div class="stats-box">
            <div id="final-score">Score: 0</div>
            <div id="high-score">Best: 0</div>
          </div>
          <button id="restart-btn" class="action-btn">Play Again</button>
        </div>
      </div>

      <div id="corgi"></div>
      <div id="obstacle">🌵</div>
      <div id="ground"></div>
    </div>

    <div id="controls">
      <p>Tap, Click, or press Spacebar to jump!</p>
      <div id="credits">Developed by Lucas Prado</div> </div>
  </div>

  <script>
    const DOM = {
      corgi: document.getElementById('corgi'),
      obstacle: document.getElementById('obstacle'),
      message: document.getElementById('message'),
      scoreDisplay: document.getElementById('score-display'),
      finalScore: document.getElementById('final-score'),
      highScoreText: document.getElementById('high-score'),
      gameArea: document.getElementById('game-area'),
      startScreen: document.getElementById('start-screen'),
      ground: document.getElementById('ground')
    };

    const state = {
      isGaming: false,
      score: 0,
      highScore: 0,
      speed: 7, 
      frames: 0,
      corgiY: 0,
      corgiVelocity: 0,
      gravity: 0.8,    
      jumpPower: -16,  
      isGrounded: true,
      obstacleX: 1000,
      gameLoopId: null
    };

    function init() {
      createClouds();
      setupEvents();
    }

    function createClouds() {
      // Criação das nuvens (estilo Mario/Cartoon)
      for (let i = 0; i < 3; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        cloud.style.width = `${Math.random() * 50 + 40}px`;
        cloud.style.height = `${Math.random() * 15 + 15}px`;
        cloud.style.left = `${Math.random() * 100}%`;
        cloud.style.top = `${Math.random() * 25}%`; // Bem no topo
        cloud.style.opacity = Math.random() * 0.4 + 0.6;
        DOM.gameArea.appendChild(cloud);
      }
    }

    function setupEvents() {
      document.getElementById('start-btn').addEventListener('click', startGame);
      document.getElementById('restart-btn').addEventListener('click', startGame);
      
      const jumpHandler = (e) => {
        if(e.code === 'Space') e.preventDefault(); 
        if (!state.isGaming && e.type !== 'keydown') return;
        if (!state.isGaming && ['Space', 'ArrowUp', 'w'].includes(e.code)) return startGame();
        jump();
      };

      document.addEventListener('touchstart', jumpHandler, { passive: false });
      document.addEventListener('mousedown', jumpHandler);
      document.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'w'].includes(e.code)) jumpHandler(e);
      });
    }

    function jump() {
      if (state.isGrounded && state.isGaming) {
        state.corgiVelocity = state.jumpPower;
        state.isGrounded = false;
      }
    }

    function startGame() {
      state.isGaming = true;
      state.score = 0;
      state.frames = 0;
      state.speed = 7;
      state.corgiY = 0;
      state.obstacleX = DOM.gameArea.offsetWidth + 50;
      state.corgiVelocity = 0;
      
      DOM.startScreen.style.display = 'none';
      DOM.message.style.display = 'none';
      DOM.obstacle.style.display = 'block';
      DOM.ground.classList.add('ground-moving');
      DOM.scoreDisplay.textContent = `Score: 0`;

      if (state.gameLoopId) cancelAnimationFrame(state.gameLoopId);
      gameLoop();
    }

    function gameLoop() {
      if (!state.isGaming) return;

      updatePhysics();
      updateObstacle();
      checkCollision();
      updateScore();

      state.gameLoopId = requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
      state.corgiVelocity += state.gravity;
      state.corgiY += state.corgiVelocity;

      if (state.corgiY >= 0) {
        state.corgiY = 0;
        state.isGrounded = true;
        state.corgiVelocity = 0;
      }

      DOM.corgi.style.transform = `translateY(${state.corgiY}px)`;
    }

    function updateObstacle() {
      state.obstacleX -= state.speed;
      
      if (state.obstacleX < -80) {
        state.obstacleX = DOM.gameArea.offsetWidth + Math.random() * 400 + 200; 
      }
      
      DOM.obstacle.style.left = `${state.obstacleX}px`;
    }

    function updateScore() {
      state.frames++;
      if (state.frames % 10 === 0) {
        state.score++;
        DOM.scoreDisplay.textContent = `Score: ${state.score}`;
        
        if (state.score % 150 === 0) { // Aumenta dificuldade a cada 150 pontos
          state.speed += 0.7;
        }
      }
    }

    function checkCollision() {
      const corgiRect = DOM.corgi.getBoundingClientRect();
      const obsRect = DOM.obstacle.getBoundingClientRect();

      // Ajuste de margem (hitbox)
      const toleranceX = 20; 
      const toleranceY = 15;

      if (
        corgiRect.right - toleranceX > obsRect.left &&
        corgiRect.left + toleranceX < obsRect.right &&
        corgiRect.bottom - toleranceY > obsRect.top &&
        corgiRect.top + toleranceY < obsRect.bottom
      ) {
        gameOver();
      }
    }

    function gameOver() {
      state.isGaming = false;
      DOM.ground.classList.remove('ground-moving');
      
      state.highScore = Math.max(state.score, state.highScore);
      
      DOM.finalScore.textContent = `Score: ${state.score}`;
      DOM.highScoreText.textContent = `Best: ${state.highScore}`;
      
      DOM.message.style.display = 'flex';
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
